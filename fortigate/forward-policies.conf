config firewall address
    edit "LAB-Agent-A"
        set subnet 10.77.10.10 255.255.255.255
    next
    edit "LAB-Agent-B"
        set subnet 10.77.20.10 255.255.255.255
    next
    edit "LAB-Tools"
        set subnet 10.77.30.10 255.255.255.255
    next
end

config firewall service custom
    edit "LAB-A2A-8081"
        set tcp-portrange 8081
    next
    edit "LAB-MCP-8082"
        set tcp-portrange 8082
    next
end

config firewall policy
    edit 701
        set name "LAB-A2A"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAB-Agent-A"
        set dstaddr "LAB-Agent-B"
        set action accept
        set schedule "always"
        set service "LAB-A2A-8081"
        set utm-status disable
        set logtraffic all
        set logtraffic-start enable
        set nat disable
    next
    edit 702
        set name "LAB-MCP"
        set srcintf "port3"
        set dstintf "port4"
        set srcaddr "LAB-Agent-B"
        set dstaddr "LAB-Tools"
        set action accept
        set schedule "always"
        set service "LAB-MCP-8082"
        set utm-status disable
        set logtraffic all
        set logtraffic-start enable
        set nat disable
    next
    edit 703
        set name "LAB-HTTPS-A"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "LAB-Agent-A"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status disable
        set logtraffic all
        set logtraffic-start enable
        set nat enable
    next
    edit 704
        set name "LAB-HTTPS-B"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "LAB-Agent-B"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status disable
        set logtraffic all
        set logtraffic-start enable
        set nat enable
    next
    edit 707
        set name "LAB-HTTPS-Tools"
        set srcintf "port4"
        set dstintf "port1"
        set srcaddr "LAB-Tools"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status disable
        set logtraffic all
        set logtraffic-start enable
        set nat enable
    next
end
